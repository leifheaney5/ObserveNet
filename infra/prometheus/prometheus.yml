# Scrapes ObserveNet's own internal metrics listeners (port 9464, internal network only).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: observenet
    static_configs:
      - targets: ["api:9464"]
        labels: { component: api }
      - targets: ["worker:9464"]
        labels: { component: worker }
      - targets: ["scheduler:9464"]
        labels: { component: scheduler }
