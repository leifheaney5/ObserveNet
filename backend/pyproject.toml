[project]
name = "observenet"
version = "0.1.0"
description = "ObserveNet backend: home-network observability and read-only posture verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",  # <2.1: opentelemetry-instrumentation-sqlalchemy does not support 2.1 yet
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "dramatiq[redis]>=1.17",
    "strawberry-graphql[fastapi]>=0.240",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
graph = ["neo4j>=5.20"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "asgi-lifespan>=2.1",
    "fakeredis>=2.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observenet"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["B008", "S101", "S104", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
